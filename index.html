<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kedai Kisanak - Sistem POS Kedai Kopi Modern. Specialty coffee &amp; pastry since 2016.">

    <!-- ══════════════════════════════════════════════════════
         SECURITY: Content Security Policy (CSP) Ketat
         ══════════════════════════════════════════════════════
         Kebijakan keamanan konten tanpa 'unsafe-inline' pada script:
         - default-src 'self': Hanya resource domain lokal
         - script-src 'self' CDN: SweetAlert2 & html5-qrcode (ZERO inline script)
         - style-src 'self' 'unsafe-inline' CDN: Style lokal & Google Fonts
         - font-src 'self' Google Fonts
         - img-src 'self' data: QRServer (QR code generator)
         - connect-src 'self' ipify (terminal IP lookup)
         - media-src 'self'
         - object-src 'none': Blokir flash/java/plugins
         - base-uri 'self': Cegah base tag hijack
         - form-action 'self': Cegah form redirection hijack
         ══════════════════════════════════════════════════════ -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://api.qrserver.com; connect-src 'self' https://api.ipify.org; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';">

    <!-- SECURITY: Mencegah MIME-type sniffing -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">

    <!-- SECURITY: Mencegah clickjacking -->
    <meta http-equiv="X-Frame-Options" content="DENY">

    <!-- SECURITY: Kontrol referrer information -->
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <title>Kedai Kisanak — Point of Sale</title>

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="./gambar/logo_kisanak.jpg">

    <!-- Stylesheet Utama -->
    <link rel="stylesheet" href="./css/style.css">

    <!-- CDN: SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>
<body>

    <!-- ══════════════════════════════════════════════════════
         HEADER — Logo, IP Address, Jam, dan Aksi Cepat
         ══════════════════════════════════════════════════════ -->
    <header class="header">
        <div class="header-brand">
            <img src="./gambar/logo_kisanak.jpg" alt="Logo Kedai Kisanak" class="logo">
            <div class="header-ip" id="header-ip">
                <span class="ip-label">Terminal IP</span>
                <span class="ip-value" id="ip-value">Memuat...</span>
            </div>
        </div>

        <div class="header-actions">
            <span class="header-clock" id="header-clock">Memuat...</span>
            <!-- SECURITY: Tidak ada inline onclick — event listener dipasang di js/app.js -->
            <button class="btn-icon" id="btn-scan-qr" title="Scan QR Code">📷</button>
            <button class="btn-icon" id="btn-history" title="Riwayat Transaksi">📋</button>
            <button class="btn-icon" id="btn-reset" title="Reset Database">🔄</button>
        </div>
    </header>

    <!-- ══════════════════════════════════════════════════════
         MAIN CONTAINER — Layout 3 kolom
         ══════════════════════════════════════════════════════ -->
    <div class="main-container">

        <!-- SIDEBAR: Filter Kategori (diisi dinamis oleh app.js) -->
        <aside class="sidebar" id="sidebar"></aside>

        <!-- AREA MENU: Katalog Produk -->
        <main class="menu-section">
            <div class="menu-header">
                <h2 id="menu-title">Semua Menu</h2>
                <span class="item-count" id="item-count">0 item</span>
            </div>
            <div class="search-bar">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input" 
                       placeholder="Cari menu kopi, pastry..." 
                       autocomplete="off"
                       maxlength="100">
            </div>
            <div class="menu-grid" id="menu-grid"></div>
        </main>

        <!-- PANEL ORDER: Keranjang Belanja -->
        <aside class="order-panel">
            <div class="panel-header">
                <h3>🛒 Pesanan</h3>
                <button class="btn-clear" id="btn-clear-cart">Kosongkan</button>
            </div>

            <!-- SECURITY & AUDIT FEATURE: Input Nama Pelanggan & Catatan Pesanan -->
            <div class="customer-input-section">
                <div class="input-group">
                    <label for="customer-name" class="input-label">Nama Pelanggan</label>
                    <input type="text" id="customer-name" 
                           placeholder="Misal: Kak Rian (opsional)" 
                           maxlength="50" autocomplete="off">
                </div>
                <div class="input-group">
                    <label for="order-notes" class="input-label">Catatan Pesanan</label>
                    <input type="text" id="order-notes" 
                           placeholder="Misal: Less ice, less sugar" 
                           maxlength="100" autocomplete="off">
                </div>
            </div>

            <div class="order-items-container" id="order-items-container"></div>
            <div class="order-footer" id="order-footer"></div>
        </aside>
    </div>

    <!-- ══════════════════════════════════════════════════════
         MODALS
         ══════════════════════════════════════════════════════ -->

    <!-- MODAL: QRIS -->
    <div class="modal-overlay" id="qris-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📱 Pembayaran QRIS</h3>
                <button class="modal-close" id="btn-close-qris">✕</button>
            </div>
            <div class="qris-content">
                <p style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:8px;" id="qris-order-num"></p>
                <p class="qris-amount" id="qris-amount">Rp 0</p>
                <div class="qris-image-wrapper">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&amp;data=KISANAK-QRIS-PAYMENT-DUMMY&amp;color=2C1810" 
                         alt="QRIS Code" id="qris-image">
                </div>
                <div class="qris-waiting">
                    <div class="spinner"></div>
                    <span>Menunggu pembayaran masuk...</span>
                </div>
                <p style="font-size:0.75rem;color:var(--text-muted);margin-top:16px;">
                    Scan QR code di atas menggunakan aplikasi e-wallet Anda
                </p>
            </div>
        </div>
    </div>

    <!-- MODAL: QR Scanner -->
    <div class="modal-overlay" id="scanner-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📷 Scan QR Code</h3>
                <button class="modal-close" id="btn-close-scanner">✕</button>
            </div>
            <div class="scanner-content">
                <p style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:16px;">
                    Arahkan kamera ke QR Code untuk scan voucher atau kartu loyalty
                </p>
                <div id="qr-reader"></div>
                <div class="scanner-result" id="scanner-result"></div>
            </div>
        </div>
    </div>

    <!-- MODAL: Riwayat Transaksi -->
    <div class="modal-overlay" id="history-modal">
        <div class="modal-content" style="max-width:560px;">
            <div class="modal-header">
                <h3>📋 Riwayat Transaksi</h3>
                <button class="modal-close" id="btn-close-history">✕</button>
            </div>
            <div class="history-list" id="history-list"></div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Receipt Container (tersembunyi, untuk cetak) -->
    <div id="receipt-container"></div>

    <!-- ══════════════════════════════════════════════════════
         SCRIPTS — External CDN Libraries & Modular ES6 Entry Point
         ══════════════════════════════════════════════════════ -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script type="module" src="./js/main.js"></script>

</body>
</html>
