# ============================================================
# netlify.toml — Konfigurasi Deployment & Performa Kedai Kisanak
# ============================================================

[build]
  publish = "."

# ─── Caching Aset Statis (Optimasi Lighthouse) ───────────────
# Aset gambar: cache 1 tahun (immutable)
[[headers]]
  for = "/gambar/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Aset CSS: cache 1 minggu dengan stale-while-revalidate
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Aset JavaScript ES6 Modules: cache 1 minggu
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# ─── Global Security Headers ────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://api.qrserver.com; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';"
