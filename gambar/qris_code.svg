<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <!-- Background -->
  <rect width="220" height="220" fill="#FFFFFF" rx="8"/>
  
  <!-- Outer Finder Patterns (Top-Left, Top-Right, Bottom-Left) -->
  <!-- Top-Left Finder -->
  <rect x="18" y="18" width="56" height="56" rx="4" fill="#2C1810"/>
  <rect x="26" y="26" width="40" height="40" rx="2" fill="#FFFFFF"/>
  <rect x="34" y="34" width="24" height="24" rx="2" fill="#2C1810"/>

  <!-- Top-Right Finder -->
  <rect x="146" y="18" width="56" height="56" rx="4" fill="#2C1810"/>
  <rect x="154" y="26" width="40" height="40" rx="2" fill="#FFFFFF"/>
  <rect x="162" y="34" width="24" height="24" rx="2" fill="#2C1810"/>

  <!-- Bottom-Left Finder -->
  <rect x="18" y="146" width="56" height="56" rx="4" fill="#2C1810"/>
  <rect x="26" y="154" width="40" height="40" rx="2" fill="#FFFFFF"/>
  <rect x="34" y="162" width="24" height="24" rx="2" fill="#2C1810"/>

  <!-- Timing Patterns -->
  <g fill="#2C1810">
    <!-- Horizontal timing -->
    <rect x="82" y="42" width="8" height="8"/>
    <rect x="98" y="42" width="8" height="8"/>
    <rect x="114" y="42" width="8" height="8"/>
    <rect x="130" y="42" width="8" height="8"/>
    <!-- Vertical timing -->
    <rect x="42" y="82" width="8" height="8"/>
    <rect x="42" y="98" width="8" height="8"/>
    <rect x="42" y="114" width="8" height="8"/>
    <rect x="42" y="130" width="8" height="8"/>
  </g>

  <!-- Alignment Pattern (Bottom-Right area) -->
  <rect x="150" y="150" width="36" height="36" rx="2" fill="#2C1810"/>
  <rect x="156" y="156" width="24" height="24" fill="#FFFFFF"/>
  <rect x="162" y="162" width="12" height="12" fill="#2C1810"/>

  <!-- QR Data Matrix Pattern Simulation (Authentic POS Density) -->
  <g fill="#2C1810">
    <!-- Column 1 -->
    <rect x="82" y="18" width="8" height="8"/>
    <rect x="98" y="18" width="8" height="16"/>
    <rect x="114" y="26" width="8" height="8"/>
    <rect x="130" y="18" width="8" height="8"/>
    <rect x="82" y="34" width="8" height="8"/>

    <!-- Center Data Block -->
    <rect x="58" y="82" width="16" height="8"/>
    <rect x="82" y="66" width="8" height="16"/>
    <rect x="98" y="66" width="16" height="8"/>
    <rect x="122" y="66" width="8" height="8"/>
    <rect x="138" y="66" width="8" height="16"/>
    <rect x="154" y="82" width="8" height="8"/>
    <rect x="170" y="82" width="16" height="8"/>
    <rect x="194" y="82" width="8" height="8"/>

