    <rect x="98" y="114" width="24" height="24" rx="4" fill="#C8956C"/>
    <text x="110" y="131" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">☕</text>

    <!-- Lower-middle grid -->
    <rect x="58" y="122" width="8" height="8"/>
    <rect x="74" y="122" width="16" height="8"/>
    <rect x="58" y="138" width="16" height="8"/>
    <rect x="82" y="130" width="8" height="16"/>
    <rect x="130" y="114" width="8" height="8"/>
    <rect x="146" y="114" width="16" height="8"/>
    <rect x="170" y="114" width="8" height="16"/>
    <rect x="186" y="122" width="16" height="8"/>
    <rect x="130" y="130" width="16" height="8"/>
    <rect x="154" y="130" width="8" height="8"/>
    <rect x="170" y="138" width="16" height="8"/>

    <!-- Bottom Data Grid -->
    <rect x="82" y="154" width="8" height="16"/>
    <rect x="98" y="146" width="16" height="8"/>
    <rect x="122" y="146" width="8" height="16"/>
    <rect x="138" y="154" width="8" height="8"/>
    <rect x="82" y="178" width="16" height="8"/>
    <rect x="106" y="170" width="8" height="16"/>
    <rect x="122" y="178" width="16" height="8"/>
    <rect x="138" y="170" width="8" height="8"/>
    <rect x="194" y="146" width="8" height="16"/>
    <rect x="194" y="170" width="8" height="16"/>
    <rect x="154" y="194" width="16" height="8"/>
    <rect x="178" y="194" width="8" height="8"/>
    <rect x="82" y="194" width="8" height="8"/>
    <rect x="98" y="194" width="16" height="8"/>
    <rect x="122" y="194" width="8" height="8"/>
    <rect x="138" y="186" width="8" height="16"/>
  </g>

  <!-- QRIS Header / Footer Branding -->
  <text x="110" y="14" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#2C1810" text-anchor="middle" letter-spacing="1">QRIS STANDAR PEMBAYARAN NASIONAL</text>
  <text x="110" y="214" font-family="'Inter', sans-serif" font-size="7" font-weight="600" fill="#C8956C" text-anchor="middle" letter-spacing="0.5">KEDAI KISANAK OFFICIAL MERCHANT</text>
