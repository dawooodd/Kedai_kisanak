    <rect x="58" y="98" width="8" height="16"/>
    <rect x="74" y="90" width="8" height="16"/>
    <rect x="90" y="82" width="8" height="8"/>
    <rect x="90" y="98" width="16" height="8"/>
    <rect x="114" y="90" width="16" height="16"/>
    <rect x="138" y="98" width="8" height="8"/>
    <rect x="154" y="98" width="16" height="8"/>
    <rect x="178" y="98" width="8" height="16"/>
    <rect x="194" y="98" width="8" height="8"/>

